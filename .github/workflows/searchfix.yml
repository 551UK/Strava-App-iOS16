name: Build Strava Search iOS16 add-on
on:
  push:
    branches: [main]
    paths:
      - "SearchFix/**"
      - ".github/workflows/searchfix.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Build standalone search fix
        working-directory: SearchFix
        run: make clean package FINALPACKAGE=1
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          set -- SearchFix/packages/*.deb
          test "$#" -eq 1
          test "$(dpkg-deb -f "$1" Package)" = "com.551uk.stravasearch16"
          test "$(dpkg-deb -f "$1" Version)" = "1.0.0"
          test "$(dpkg-deb -f "$1" Architecture)" = "iphoneos-arm64"
          dpkg-deb -x "$1" "$RUNNER_TEMP/searchfix"
          root="$RUNNER_TEMP/searchfix/var/jb/Library/MobileSubstrate/DynamicLibraries"
          test -s "$root/StravaSearch16.dylib"
          strings "$root/StravaSearch16.dylib" | grep -F "UI_TRY_AGAIN" >/dev/null
          strings "$root/StravaSearch16.dylib" | grep -F "HTTP_FINISH" >/dev/null
          strings "$root/StravaSearch16.dylib" | grep -F "GRAPHQL_ERRORS" >/dev/null
          strings "$root/StravaSearch16.dylib" | grep -F "SHARE_SNAPSHOT_BEGIN" >/dev/null
          strings "$root/StravaSearch16.dylib" | grep -F "NATIVE_ROUTE_SCAN" >/dev/null
          strings "$root/StravaSearch16.dylib" | grep -F "CHECKOUT_FRAME" >/dev/null
          strings "$root/StravaSearch16.dylib" | grep -F "HUD_READY" >/dev/null
          strings "$root/StravaSearch16.dylib" | grep -F "Strava routes" >/dev/null
          test -s "$root/StravaSearch16.plist"
          plutil -lint "$root/StravaSearch16.plist"
          xcrun lipo "$root/StravaSearch16.dylib" -verify_arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: StravaSearch16-1.0.0-diagnostics-rootless
          path: SearchFix/packages/*.deb
          if-no-files-found: error
      - name: Publish diagnostic prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create searchfix-v1.0.0 SearchFix/packages/*.deb --target "$GITHUB_SHA" --prerelease --title "Strava Search 1.0.0 — bridge diagnostics" --notes-file SearchFix/RELEASE.md
