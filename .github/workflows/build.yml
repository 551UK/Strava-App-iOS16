name: Remove release DEB attachments
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all .deb release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | .assets[] | select(.name | endswith(".deb")) | .id')
          echo "Found ${#ids[@]} .deb attachments"
          for id in "${ids[@]}"; do
            echo "Deleting asset $id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
          done
          mapfile -t remaining < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | .assets[] | select(.name | endswith(".deb")) | .id')
          test "${#remaining[@]}" -eq 0
          echo "Release attachments cleaned"
