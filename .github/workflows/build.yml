name: Build and release StravaCompat rootless
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: strava-rootless
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Build rootless DEB
        run: make clean package FINALPACKAGE=1
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          set -- packages/*.deb
          test "$#" -eq 1
          deb="$1"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551uk.stravacompat"
          test "$(dpkg-deb -f "$deb" Version)" = "0.1.1"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/strava-check"
          dylib="$RUNNER_TEMP/strava-check/var/jb/Library/MobileSubstrate/DynamicLibraries/StravaCompat.dylib"
          filter="$RUNNER_TEMP/strava-check/var/jb/Library/MobileSubstrate/DynamicLibraries/StravaCompat.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64
          plutil -lint "$filter"
          dpkg-deb --info "$deb"
      - uses: actions/upload-artifact@v4
        with:
          name: StravaCompat-iOS16-rootless
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          tag="v$version"
          notes="Experimental crash-mitigation build for Strava 422.0.1. Removes unsafe early hooks; hooks validated isAppVersionValid when signature matches; retains app and header version spoof. iOS spoof off by default. Device startup and login not yet verified."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/*.deb --clobber
          else
            gh release create "$tag" packages/*.deb --target "$GITHUB_SHA" --title "StravaCompat $version (experimental)" --notes "$notes"
          fi
