name: Build Strava Native Bridge experimental
on:
  push:
    branches: [native-bridge]
    paths:
      - "NativeBridge/**"
      - ".github/workflows/nativebridge.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Build bridge
        working-directory: NativeBridge
        run: make clean package FINALPACKAGE=1
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          set -- NativeBridge/packages/*.deb
          test "$#" -eq 1
          test "$(dpkg-deb -f "$1" Package)" = "com.551uk.stravasearch16"
          test "$(dpkg-deb -f "$1" Version)" = "1.3.0"
          dpkg-deb -x "$1" "$RUNNER_TEMP/native"
          file="$RUNNER_TEMP/native/var/jb/Library/MobileSubstrate/DynamicLibraries/StravaSearch16.dylib"
          test -s "$file"
          strings "$file" | grep -F "NATIVE_BRIDGE_ACTION" >/dev/null
          xcrun lipo "$file" -verify_arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: StravaNativeBridge-1.3.0
          path: NativeBridge/packages/*.deb
          if-no-files-found: error
      - name: Release experimental build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nativebridge-v1.3.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" NativeBridge/packages/*.deb --clobber
          else
            gh release create "$tag" NativeBridge/packages/*.deb --target "$GITHUB_SHA" --prerelease --title "Strava Native Bridge 1.3.0" --notes-file NativeBridge/README.md
          fi
