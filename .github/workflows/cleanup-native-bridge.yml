name: Remove obsolete Strava Native Bridge branches
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-native-bridge.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete Native Bridge branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in native-bridge nearby-walks-v1.4; do
            ref="heads/$branch"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$ref"
              echo "Deleted $branch"
            else
              echo "Branch $branch already absent"
            fi
          done
